server {
    listen 80;
    server_name thebookon.ca www.thebookon.ca _;
    root /usr/share/nginx/html;
    index index.html;

    if ($host = www.thebookon.ca) {
        return 308 https://thebookon.ca$request_uri;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"thebookon"}';
    }

    location / {
        try_files $uri $uri/ /404.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
